name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Lint, test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # npm ci installs the exact lockfile, so CI and Vercel agree.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Vitest with jsdom: the lib/ helpers and one component example.
      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build